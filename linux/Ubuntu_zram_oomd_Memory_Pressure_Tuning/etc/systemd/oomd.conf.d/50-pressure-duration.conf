# How long memory pressure must stay above the limit before oomd acts.
# Ubuntu's effective default is 20s; the chrome kill fired right at that edge.
# Raise to 30s so a brief spike (a tab loading, a build linking) rides through
# without a kill. Pairs with the 50%->80% limit bump in the user@ drop-in.
[OOM]
DefaultMemoryPressureDurationSec=30s
