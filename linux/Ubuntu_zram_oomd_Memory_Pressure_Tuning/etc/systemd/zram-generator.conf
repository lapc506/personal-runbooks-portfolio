# zram swap on RAM (compressed). Installed via systemd-zram-generator.
# Verify after `systemctl daemon-reload`: `zramctl` and `swapon --show`.
#
# Why a HIGHER swap-priority than the disk swapfile: zram must be filled
# FIRST (it is compressed RAM, ~3-5x cheaper than disk I/O). The /swap.img
# file sits at priority -2, so anything > -2 wins; 100 makes the intent loud.
[zram0]
# 16 GiB of compressed swap, but never more than physical RAM.
zram-size = min(ram, 16384)
compression-algorithm = zstd
swap-priority = 100
# Tell the kernel this is fast swap so the memory manager treats it accordingly.
fs-type = swap
