# oomd watches the per-user slice (user@1000.service) and kills its heaviest
# cgroup when memory pressure stays above this limit for longer than the
# duration window. Ubuntu ships this at 50%; chrome-lapc506 (4.2 GB) was killed
# when the slice crossed 85.61% for >20s. Raise to 80% for more headroom.
#
# SAFE ONLY because zram now absorbs the spike in compressed RAM. See README
# "Tradeoffs": a higher limit means oomd tolerates longer pressure spikes
# before killing -> fewer annoying kills, but more real-freeze risk if RAM
# actually runs out. zram is the safety net that makes this coherent.
[Service]
ManagedOOMMemoryPressureLimit=80%
