# With zram, "swap" is compressed RAM, not disk. The usual "lower swappiness
# to avoid the disk" advice is INVERTED here: you WANT the kernel to prefer
# moving cold pages into zram (fast, in-RAM) over reclaiming file cache.
# 60 (the old disk-swap value) is too shy; 150 is the common zram tuning.
vm.swappiness = 150

# Page-cluster 0 = read one page at a time from swap. zram has no seek cost,
# so batched readahead (default 3 = 8 pages) just wastes decompression work.
vm.page-cluster = 0
